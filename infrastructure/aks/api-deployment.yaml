apiVersion: apps/v1
kind: Deployment
metadata:
  name: contoso-kendo-grid-api
  namespace: contoso-apps
  labels:
    app: contoso-kendo-grid-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: contoso-kendo-grid-api
  template:
    metadata:
      labels:
        app: contoso-kendo-grid-api
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: CONTOSO_API_SERVICEACCOUNT_NAME
      automountServiceAccountToken: false
      containers:
      - name: contoso-kendo-grid-api
        image: ACR_NAME.azurecr.io/contosokendogridapi:IMAGE_TAG
        ports:
        - containerPort: 8080
        env:
        - name: baseBslUrl
          value: "http://contoso-kendo-grid-bsl:8080/" # NOSONAR - internal only service in DEV environment
        - name: keyVaultUrl
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: keyVaultUrl
        - name: bslCertificateName
          value: "frontend-client-cert"
        - name: AllowedOrigins__0
          value: "*"
        envFrom:
        - configMapRef:
            name: app-config
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
            ephemeral-storage: "512Mi"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /weatherforecast
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /weatherforecast
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5